name: Run unit tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
        qt-api: ["pyqt6", "pyside6"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "${{ matrix.qt-api }}" matplotlib

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: ${{ matrix.qt-api }}
        run: |
          set -e
          for test_file in tests/unittests/test_*.py; do
            python -m pytest "$test_file"
          done
